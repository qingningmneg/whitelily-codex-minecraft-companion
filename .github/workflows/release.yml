name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - shell: pwsh
        run: ./scripts/release-check.ps1 -SkipInstall
      - shell: pwsh
        run: ./scripts/package-release.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - uses: actions/upload-artifact@v4
        with:
          name: whitelily-windows-x64
          path: |
            release/whitelily-*-windows-x64.zip
            release/whitelily-*-windows-x64.zip.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/whitelily-*-windows-x64.zip release/whitelily-*-windows-x64.zip.sha256 --title $env:GITHUB_REF_NAME --generate-notes
