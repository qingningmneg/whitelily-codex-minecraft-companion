name: release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run desktop:prepare
      - run: npm test
      - run: npm run build
      - shell: pwsh
        run: ./scripts/release-check.ps1 -SkipInstall
      - shell: pwsh
        run: ./scripts/package-installer.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - shell: pwsh
        run: ./scripts/package-release.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - uses: actions/upload-artifact@v4
        with:
          name: whitelily-windows-x64
          path: |
            release/WhiteLily-*-windows-x64-setup.exe
            release/WhiteLily-*-windows-x64-setup.exe.sha256
            release/WhiteLily-*-windows-x64-setup.exe.signing-status.txt
            release/whitelily-*-windows-x64.zip
            release/whitelily-*-windows-x64.zip.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assets = @(
            "release/WhiteLily-$version-windows-x64-setup.exe"
            "release/WhiteLily-$version-windows-x64-setup.exe.sha256"
            "release/WhiteLily-$version-windows-x64-setup.exe.signing-status.txt"
            "release/whitelily-$version-windows-x64.zip"
            "release/whitelily-$version-windows-x64.zip.sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Required release asset is missing: $asset"
            }
          }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --generate-notes --prerelease
