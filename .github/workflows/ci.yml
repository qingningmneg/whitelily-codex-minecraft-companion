name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use stable runner temp
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run desktop:prepare
      - run: npm test -- --no-file-parallelism
      - run: npm run build
      - shell: pwsh
        run: ./scripts/release-check.ps1 -SkipInstall
